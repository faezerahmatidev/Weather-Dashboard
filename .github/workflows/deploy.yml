# Demo deployment to GitHub Pages (official Pages Actions, no extra deps).
#
# One-time repo setup (owner only, in GitHub web UI):
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
# After that, every push to main rebuilds and publishes:
#   https://faezerahmatidev.github.io/Weather-Dashboard/
#
# SPA notes:
# - Built with --base-href=/Weather-Dashboard/ so assets resolve under the
#   project sub-path.
# - index.html is copied to 404.html so deep links (e.g. /calendar) and
#   refreshes work despite Pages having no server-side rewrites.

name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npx ng build --base-href=/Weather-Dashboard/

      - name: SPA fallback for deep links
        run: cp dist/weather-dashboard/browser/index.html dist/weather-dashboard/browser/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/weather-dashboard/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
